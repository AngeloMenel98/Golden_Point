services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gp-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8080
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - gp-network

networks:
  gp-network:
    name: gp-network
    external: true
